name: Build Android APK and publish download page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare download page
        run: |
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/Qarjy-Basqaru.apk
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="kk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#164e45">
            <title>Qarjy Basqaru — Android</title>
            <style>
              body{font:16px system-ui,sans-serif;background:#f7f7f2;color:#1c2925;margin:0;min-height:100vh;display:grid;place-items:center}
              main{max-width:520px;margin:24px;padding:32px;background:#fffefa;border:1px solid #e1e9e2;border-radius:22px;text-align:center}
              h1{color:#164e45}p{line-height:1.6;color:#52635a}
              a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:12px;background:#164e45;color:white;text-decoration:none;font-weight:700}
              small{display:block;margin-top:18px;color:#718078}
            </style>
          </head>
          <body><main>
            <h1>Qarjy Basqaru</h1>
            <p>Android қолданбасын жүктеп алыңыз.</p>
            <a href="Qarjy-Basqaru.apk" download>APK жүктеп алу</a>
            <small>Орнату үшін Android құрылғысында жүктелген APK файлын ашыңыз.</small>
          </main></body></html>
          EOF

      - name: Publish download page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
